<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnoughWork</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #111;
      user-select: none;
      border-radius: 12px;
      overflow: hidden;
    }
    .notify-container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      height: 100vh;
      gap: 12px;
      cursor: grab;
    }
    .notify-container:active {
      cursor: grabbing;
    }
    .notify-container button {
      cursor: pointer;
    }
    .notify-title {
      font-size: 18px;
      font-weight: 700;
      color: #4f46e5;
    }
    .notify-subtitle {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }
    .notify-buttons {
      display: flex;
      gap: 10px;
      margin-top: 4px;
      justify-content: center;
    }
    .notify-btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      font-family: inherit;
    }
    .notify-btn-snooze {
      background: transparent;
      color: #666;
      border-color: #e5e7eb;
    }
    .notify-btn-snooze:hover {
      border-color: #999;
      color: #111;
    }
    .notify-btn-stop {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
    .notify-btn-stop:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="notify-container">
    <div class="notify-title" id="notify-title">&ZeroWidthSpace;</div>
    <div class="notify-subtitle" id="notify-subtitle">&ZeroWidthSpace;</div>
    <div class="notify-buttons">
      <button class="notify-btn notify-btn-snooze" id="btn-snooze">Snooze 30m</button>
      <button class="notify-btn notify-btn-stop" id="btn-stop">Stop for today</button>
    </div>
  </div>
  <script type="module" src="../notify.js"></script>
</body>
</html>
