<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnoughWork</title>
  <script>
    // Apply the stored/system theme before first paint (shared localStorage
    // with the main window); live changes arrive via the app-theme event.
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.dataset.theme = "dark";
      }
    } catch (e) {}
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: transparent;
      color: #111;
      user-select: none;
      border-radius: 12px;
      overflow: hidden;
    }
    /* Glass at rest — mostly transparent, melts to opaque on hover */
    .task-popout {
      position: relative;
      height: 100vh;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      transition: background 0.25s ease;
      cursor: grab;
    }
    .task-popout:hover,
    .task-popout:focus-within {
      background: rgba(255, 255, 255, 0.97);
    }
    .task-popout:active {
      cursor: grabbing;
    }
    .task-popout button {
      cursor: pointer;
    }

    /* "TASK · title" on one line — baseline alignment puts the mixed font
       sizes on one typographic baseline */
    .task-popout-head {
      display: flex;
      align-items: baseline;
      gap: 6px;
      max-width: 100%;
    }
    .task-popout-label {
      font-size: 10px;
      font-weight: 600;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .task-popout-title {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .task-popout-time {
      font-size: 38px;
      font-weight: 700;
      color: #111;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      text-align: center;
    }
    .task-popout-time.has-hours {
      font-size: 30px;
    }
    .task-popout-time.paused {
      color: #999;
    }

    .task-popout-bar {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .task-popout-fill {
      height: 100%;
      width: 0%;
      background: #f59e0b;
      transition: width 0.4s ease;
    }
    .task-popout-state {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      /* Fixed height = line height, so appearing text can't shift the layout */
      line-height: 14px;
      height: 14px;
      text-align: center;
    }
    /* Done: green lives on the checkmark line, not the timer digits */
    .task-popout-state.done {
      color: #15803d;
    }
    /* Nudges up out of the way as the drawer slides in — same easing so the
       two move together */
    .task-popout-mid {
      position: relative;
      top: 0;
      transition: top 0.25s ease;
    }
    .task-popout:hover .task-popout-mid,
    .task-popout:focus-within .task-popout-mid {
      top: -10px;
    }

    /* Controls as a bottom drawer: slides up over the progress bar on hover,
       slides back out when the mouse leaves */
    .task-popout-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48px;
      border-radius: 0 0 12px 12px;
      background: #ffffff;
      box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.09);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .task-popout:hover .task-popout-drawer,
    .task-popout:focus-within .task-popout-drawer {
      transform: translateY(0);
    }

    .task-popout-btn {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid #e5e7eb;
      background: transparent;
      color: #666;
      transition: all 0.15s;
    }
    .task-popout-btn:hover {
      border-color: #f59e0b;
      color: #f59e0b;
    }
    .task-popout-btn.danger:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
    .task-popout-btn:disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    /* ===== Dark theme (mirrors the app's dark tokens) ===== */
    html[data-theme="dark"] .task-popout {
      background: rgba(32, 32, 32, 0.55);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }
    html[data-theme="dark"] .task-popout:hover,
    html[data-theme="dark"] .task-popout:focus-within {
      background: rgba(32, 32, 32, 0.97);
    }
    html[data-theme="dark"] .task-popout-title,
    html[data-theme="dark"] .task-popout-time {
      color: #f3f3f3;
    }
    html[data-theme="dark"] .task-popout-label {
      color: #fbbf24;
    }
    html[data-theme="dark"] .task-popout-bar {
      background: rgba(255, 255, 255, 0.1);
    }
    html[data-theme="dark"] .task-popout-time.paused,
    html[data-theme="dark"] .task-popout-state {
      color: #a6a6a6;
    }
    html[data-theme="dark"] .task-popout-state.done {
      color: #22c55e;
    }
    html[data-theme="dark"] .task-popout-drawer {
      background: #202020;
      box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.4);
    }
    html[data-theme="dark"] .task-popout-btn {
      border-color: #3f3f3f;
      color: #a6a6a6;
      background: transparent;
    }
    html[data-theme="dark"] .task-popout-btn:hover {
      border-color: #fbbf24;
      color: #fbbf24;
    }
    html[data-theme="dark"] .task-popout-btn.danger:hover {
      border-color: #ff6b73;
      color: #ff6b73;
    }
  </style>
</head>
<body>
  <div class="task-popout" id="task-popout">
    <div class="task-popout-head">
      <span class="task-popout-label">Task</span>
      <span class="task-popout-title" id="task-title">Task</span>
    </div>
    <div class="task-popout-mid">
      <div class="task-popout-time" id="task-time">00:00</div>
      <div class="task-popout-state" id="task-state"></div>
    </div>
    <div class="task-popout-bar"><div class="task-popout-fill" id="task-fill"></div></div>
    <div class="task-popout-drawer">
      <button class="task-popout-btn" id="btn-toggle" title="Pause">
        <svg id="ic-pause" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg id="ic-play" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </button>
      <button class="task-popout-btn" id="btn-restart" title="Restart (full duration)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>
      </button>
      <button class="task-popout-btn danger" id="btn-stop" title="Stop task">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button class="task-popout-btn" id="btn-popin" title="Back to main window">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
  <script type="module" src="../task-timer-window.js"></script>
</body>
</html>
