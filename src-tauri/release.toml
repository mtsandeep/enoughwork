shared-version = true
tag-name = "v{{version}}"
tag-prefix = ""
publish = false
push = false
verify = false

pre-release-replacements = [
  { file = "../package.json", search = "\"version\": \"[0-9.+]+\"", replace = "\"version\": \"{{version}}\"" },
  { file = "../src-tauri/tauri.conf.json", search = "\"version\": \"[0-9.+]+\"", replace = "\"version\": \"{{version}}\"" },
  { file = "../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}" },
]
