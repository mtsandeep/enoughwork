  <button class="topbar-icon settings-gear" id="settings-gear" title="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <div class="main-container" id="main-content">
    <div class="timer-section">
      <div class="elapsed-time" id="elapsed">0h 00m 00s</div>
    </div>

    <div class="progress-wrap">
      <div class="event-overflow-stack event-overflow-stack-left">
        <div class="event-overflow event-overflow-inactive" id="event-overflow-inactive" hidden title="Missed while system not active"></div>
        <div class="event-overflow event-overflow-left" id="event-overflow-left" hidden></div>
      </div>
      <div class="progress-host" id="progress-host">
        <div class="progress-bar" id="progress-bar">
          <svg id="progress-svg" viewBox="0 0 100 6" preserveAspectRatio="none">
            <rect class="progress-track" x="0" y="0" width="100" height="6" />
            <rect class="progress-fill" id="progress" x="0" y="0" width="0" height="6" />
          </svg>
        </div>
        <div class="event-dots" id="event-dots" aria-hidden="true"></div>
      </div>
      <div class="event-overflow event-overflow-right" id="event-overflow-right" hidden></div>
    </div>

    <div class="snooze-bar" id="snooze-bar" hidden>
      <div class="snooze-progress-track">
        <div class="snooze-progress-fill" id="snooze-progress" style="width: 0%"></div>
      </div>
    </div>

    <div class="status-text" id="status">Active</div>

    <div class="controls">
      <div class="limit-setting" id="limit-setting">
        <button class="limit-btn" id="limit-down">−</button>
        <div class="limit-value" id="limit-value">
          <span class="limit-display" id="limit-display">4h 00m</span>
          <span class="limit-edit" id="limit-edit" hidden>
            <input type="number" class="num-input limit-input" id="limit-input-h" min="0" max="23" value="4" />
            <span class="limit-input-label">h</span>
            <input type="number" class="num-input limit-input" id="limit-input-m" min="0" max="59" value="0" />
            <span class="limit-input-label">m</span>
          </span>
          <div class="limit-error" id="limit-error" hidden>Invalid time, minimum 1 min</div>
        </div>
        <button class="limit-btn" id="limit-up">+</button>
        <button class="limit-btn limit-tick-btn" id="limit-tick" hidden title="Apply">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>

      <div class="btn-group">
        <button class="event-add-btn" id="btn-event-add" title="Schedule an event">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <div class="btn-slot" id="snooze-slot" hidden></div>
        <button class="btn btn-break" id="btn-take-break">Take Break</button>
        <button class="btn btn-danger" id="btn-stop">Pause/Stop for today</button>
        <button class="btn" id="btn-resume" hidden>Resume Work</button>
        <button class="btn btn-break" id="btn-resume-break" hidden>Resume Work</button>
      </div>

      <div class="break-stats" id="break-stats" hidden></div>
    </div>
  </div>

  <div class="heatmap-tooltip" id="break-tooltip" hidden></div>
  <div class="heatmap-tooltip" id="event-tooltip" hidden></div>
  <div class="heatmap-tooltip" id="ui-tooltip" hidden></div>

  <!-- Event dot detail popover -->
  <div class="event-popover" id="event-popover" hidden>
    <div class="event-popover-title" id="event-popover-title">
      <span id="event-popover-title-text"></span>
      <button class="event-popover-skip" id="event-popover-skip" hidden data-tooltip="Skip for today"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
    </div>
    <div class="event-popover-meta" id="event-popover-meta"></div>
    <div class="event-popover-actions">
      <button class="event-popover-btn" id="event-popover-edit">Edit</button>
      <button class="event-popover-btn danger" id="event-popover-delete">Delete</button>
    </div>
  </div>
  <div class="event-popover-backdrop" id="event-popover-backdrop" hidden></div>

  <!-- Break Picker Page -->
  <div class="break-picker-page" id="break-picker-page" hidden>
    <button class="settings-close" id="break-picker-close" title="Close">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="break-picker-body">
      <div class="break-picker-work-info" id="break-work-info">You've been working for <strong>2h 30m</strong></div>

      <div class="break-picker-suggestion">
        <div class="break-picker-label">Break duration</div>
        <div class="break-duration-row" id="break-duration-row">
          <span class="break-duration-display" id="break-duration-display">15m</span>
          <span class="break-duration-edit" id="break-duration-edit" hidden>
            <input type="number" class="num-input break-duration-input" id="break-input-m" min="1" max="120" value="15" />
            <span class="limit-input-label">min</span>
          </span>
        </div>
      </div>

      <div class="break-quick-picks" id="break-quick-picks">
        <button class="break-quick-btn" data-min="5">5m</button>
        <button class="break-quick-btn" data-min="10">10m</button>
        <button class="break-quick-btn" data-min="15">15m</button>
        <button class="break-quick-btn" data-min="20">20m</button>
        <button class="break-quick-btn" data-min="30">30m</button>
        <button class="break-quick-btn" data-min="60">1h</button>
      </div>

      <button class="btn btn-start-break" id="btn-start-break">Start Break</button>
    </div>
  </div>

  <!-- Quick Add Event Form -->
  <div class="event-add-panel" id="event-add-panel" hidden>
    <div class="event-add-header">
      <span class="event-add-title">Schedule Event</span>
      <button class="settings-close" id="event-add-close" title="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="event-add-body">
      <div class="event-type-toggle" id="event-type-toggle">
        <button class="event-type-btn active" data-type="reminder"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Reminder</button>
        <button class="event-type-btn" data-type="break"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>Scheduled Break</button>
      </div>

      <div class="event-field" id="event-title-field">
        <label class="event-field-label">Title</label>
        <input type="text" class="event-input" id="event-title-input" placeholder="e.g. Standup" maxlength="60" />
      </div>

      <div class="event-field" id="event-duration-field" hidden>
        <label class="event-field-label">Break duration</label>
        <div class="event-quick-picks" id="event-break-picks">
          <button class="break-quick-btn" data-min="5">5m</button>
          <button class="break-quick-btn" data-min="10">10m</button>
          <button class="break-quick-btn active" data-min="15">15m</button>
          <button class="break-quick-btn" data-min="20">20m</button>
          <button class="break-quick-btn" data-min="30">30m</button>
          <button class="break-quick-btn" data-min="60">1h</button>
          <span class="event-break-custom" id="event-break-custom">
            <button class="break-quick-btn event-break-custom-btn" id="event-break-custom-btn" type="button">
              <span id="event-break-custom-label">Custom</span>
              <svg class="event-break-custom-pencil" id="event-break-custom-pencil" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <span class="event-break-custom-editor" id="event-break-custom-editor" hidden>
              <input type="number" class="num-input limit-input limit-input-lg" id="event-break-h-input" min="0" max="3" value="0" />
              <span class="limit-input-label">h</span>
              <input type="number" class="num-input limit-input limit-input-lg" id="event-break-m-input" min="0" max="59" value="15" />
              <span class="limit-input-label">m</span>
              <button class="limit-btn limit-tick-btn limit-tick-btn-lg" id="event-break-tick" type="button" title="Apply">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </span>
          </span>
        </div>
      </div>

      <div class="event-field" id="event-overlay-field">
        <label class="event-field-label">Notification</label>
        <div class="event-pill-row" id="event-overlay-toggle">
          <button class="event-pill-btn active" data-overlay="fullscreen">Fullscreen</button>
          <button class="event-pill-btn" data-overlay="mini">Mini</button>
        </div>
      </div>

      <div class="event-field">
        <div class="event-time-header">
          <label class="event-field-label">When</label>
          <button class="event-mode-btn" id="event-mode-btn">at HH:MM</button>
        </div>
        <div class="event-time-inputs">
          <div class="event-time-clock" id="event-time-clock">
            <input type="time" class="event-input event-input-time" id="event-clock-input" />
          </div>
          <div class="event-time-relative" id="event-time-relative" hidden>
            <div class="limit-setting">
              <button class="limit-btn" id="event-rel-down" type="button">−</button>
              <div class="limit-value" id="event-rel-value">
                <span class="limit-display" id="event-rel-display">0h 30m</span>
                <span class="limit-edit" id="event-rel-edit" hidden>
                  <input type="number" class="num-input limit-input" id="event-rel-h-input" min="0" max="23" value="0" />
                  <span class="limit-input-label">h</span>
                  <input type="number" class="num-input limit-input" id="event-rel-m-input" min="0" max="59" value="30" />
                  <span class="limit-input-label">m</span>
                </span>
              </div>
              <button class="limit-btn" id="event-rel-up" type="button">+</button>
              <button class="limit-btn limit-tick-btn" id="event-rel-tick" type="button" hidden title="Apply">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="event-field" id="event-recurring-field" hidden>
        <div class="settings-row">
          <span class="event-field-label">Repeat</span>
          <label class="toggle">
            <input type="checkbox" id="event-recurring-toggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="event-day-picks" id="event-day-picks" hidden>
          <button class="event-day-btn" data-day="1">Mon</button>
          <button class="event-day-btn" data-day="2">Tue</button>
          <button class="event-day-btn" data-day="3">Wed</button>
          <button class="event-day-btn" data-day="4">Thu</button>
          <button class="event-day-btn" data-day="5">Fri</button>
          <button class="event-day-btn" data-day="6">Sat</button>
          <button class="event-day-btn" data-day="0">Sun</button>
        </div>
      </div>

      <div class="event-add-actions">
        <button class="btn" id="event-add-cancel">Cancel</button>
        <button class="btn btn-primary" id="event-add-confirm">Schedule</button>
      </div>
    </div>
  </div>

  <div class="settings-page" id="settings-page" hidden>
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button class="settings-close" id="settings-back" title="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <div class="settings-row">
          <span class="settings-label">Auto-start on boot</span>
          <label class="toggle">
            <input type="checkbox" id="setting-autostart" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <span class="settings-label">Auto check for updates</span>
          <label class="toggle">
            <input type="checkbox" id="setting-auto-update" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <span class="settings-label">Show debug bar</span>
          <label class="toggle">
            <input type="checkbox" id="setting-debug-bar" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-field">
          <label class="settings-label">Daily reset time</label>
          <input type="time" class="settings-input" id="setting-reset-time" value="00:00" />
        </div>
        <div class="settings-field">
          <label class="settings-label">Overlay title</label>
          <input type="text" class="settings-input" id="setting-overlay-title" placeholder="Enough Work!" />
        </div>
        <div class="settings-field">
          <label class="settings-label">Overlay subtitle</label>
          <input type="text" class="settings-input" id="setting-overlay-subtitle" placeholder="You've done enough for today. Time to step away." />
        </div>
      </div>
      <div class="settings-group with-group">
        <div class="settings-group-title">When fullscreen app detected</div>
        <div class="fullscreen-grid">
          <div class="fullscreen-field">
            <span class="settings-label">Fullscreen overlay</span>
            <label class="toggle">
              <input type="checkbox" id="setting-force-fullscreen" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="fullscreen-field" id="animation-field">
            <span class="settings-label" id="animation-label">Animation</span>
            <div class="select-wrapper">
              <select class="settings-input setting-input-small" id="setting-animation-type">
                <option value="none">None</option>
                <option value="star-drop">Star Drop</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="settings-version" id="settings-version">
      <span id="settings-version-text"></span>
      <button class="settings-update-btn" id="btn-check-updates" title="Check for Updates">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M2.93077 11.2003C3.00244 6.23968 7.07619 2.25 12.0789 2.25C15.3873 2.25 18.287 3.99427 19.8934 6.60721C20.1103 6.96007 20.0001 7.42199 19.6473 7.63892C19.2944 7.85585 18.8325 7.74565 18.6156 7.39279C17.2727 5.20845 14.8484 3.75 12.0789 3.75C7.8945 3.75 4.50372 7.0777 4.431 11.1982L4.83138 10.8009C5.12542 10.5092 5.60029 10.511 5.89203 10.8051C6.18377 11.0991 6.18191 11.574 5.88787 11.8657L4.20805 13.5324C3.91565 13.8225 3.44398 13.8225 3.15157 13.5324L1.47176 11.8657C1.17772 11.574 1.17585 11.0991 1.46759 10.8051C1.75933 10.511 2.2342 10.5092 2.52824 10.8009L2.93077 11.2003ZM19.7864 10.4666C20.0786 10.1778 20.5487 10.1778 20.8409 10.4666L22.5271 12.1333C22.8217 12.4244 22.8245 12.8993 22.5333 13.1939C22.2421 13.4885 21.7673 13.4913 21.4727 13.2001L21.0628 12.7949C20.9934 17.7604 16.9017 21.75 11.8825 21.75C8.56379 21.75 5.65381 20.007 4.0412 17.3939C3.82366 17.0414 3.93307 16.5793 4.28557 16.3618C4.63806 16.1442 5.10016 16.2536 5.31769 16.6061C6.6656 18.7903 9.09999 20.25 11.8825 20.25C16.0887 20.25 19.4922 16.9171 19.5625 12.7969L19.1546 13.2001C18.86 13.4913 18.3852 13.4885 18.094 13.1939C17.8028 12.8993 17.8056 12.4244 18.1002 12.1333L19.7864 10.4666Z"/>
        </svg>
      </button>
      <span class="settings-update-status" id="update-status" hidden></span>
    </div>
  </div>

  <!-- Events List Page -->
  <div class="settings-page events-page" id="events-page" hidden>
    <div class="settings-header">
      <span class="settings-title">Today's Events</span>
      <button class="settings-close" id="events-back" title="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="settings-body events-body">
      <div class="events-add-row">
        <button class="btn events-add-btn" id="events-add-reminder"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Reminder</button>
        <button class="btn btn-break events-add-btn" id="events-add-break"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Scheduled Break</button>
      </div>
      <div class="events-list" id="events-list"></div>
    </div>
  </div>
  </div><!-- end #app-area -->

  <div class="debug-bar" hidden>
    <span class="debug-label">Debug</span>
    <div class="debug-buttons">
      <button class="debug-btn" id="dbg-show-overlay">Show Overlay</button>
      <button class="debug-btn" id="dbg-show-anim">Show Animation</button>
      <button class="debug-btn" id="dbg-set-limit">Set to Limit</button>
      <button class="debug-btn" id="dbg-1min">1m Limit</button>
      <button class="debug-btn" id="dbg-1min-snooze">1m Snooze</button>
      <button class="debug-btn" id="dbg-1min-break">1m Break</button>
      <button class="debug-btn" id="dbg-1min-event">1m Reminder</button>
      <button class="debug-btn" id="dbg-day-welcome">Day Welcome</button>
      <button class="debug-btn" id="dbg-update-notify">Update Popup</button>
      <button class="debug-btn debug-btn-danger" id="dbg-clear">Clear State</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
